<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           background: #0f172a; color: #e2e8f0; -webkit-font-smoothing: antialiased; }
    a { color: #facc15; } a:hover { color: #fde68a; }
  </style>
</helmet>
<div style="padding: 12px 12px 20px; background: #0f172a;">

  <div style="font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #64748b; margin-bottom: 10px;">Sibling · Car screen</div>

  <div style="background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px 17.6px;">

    <h3 style="margin: 0 0 9.6px; font-size: 15.2px; font-weight: 600; color: #e2e8f0;">Best day to charge</h3>

    <div style="display: flex; align-items: center; gap: 14px;">
      <div style="flex: 1 1 auto; min-width: 0;">
        <div style="font-size: 20px; font-weight: 700; color: #facc15; letter-spacing: -.01em;">Thursday</div>
        <div style="font-size: 12.8px; color: #94a3b8; margin-top: 3px; line-height: 1.45; text-wrap: pretty;">
          about <strong style="color: #e2e8f0;">19 kWh spare</strong> after the house takes its share
        </div>
      </div>
      <!-- the week, at a glance, so the choice has context in one line -->
      <div style="display: flex; align-items: flex-end; gap: 5px; height: 40px; flex: 0 0 auto;">
        <span style="width: 7px; height: 38%; background: rgba(250,204,21,.30); border-radius: 3px;"></span>
        <span style="width: 7px; height: 62%; background: rgba(250,204,21,.30); border-radius: 3px;"></span>
        <span style="width: 7px; height: 41%; background: rgba(250,204,21,.30); border-radius: 3px;"></span>
        <span style="width: 7px; height: 100%; background: #facc15; border-radius: 3px;"></span>
        <span style="width: 7px; height: 50%; background: rgba(250,204,21,.30); border-radius: 3px;"></span>
        <span style="width: 7px; height: 56%; background: rgba(250,204,21,.30); border-radius: 3px;"></span>
        <span style="width: 7px; height: 53%; background: rgba(250,204,21,.30); border-radius: 3px;"></span>
      </div>
    </div>

    <p style="border-top: 1px solid #334155; margin: 11px 0 0; padding-top: 9px; font-size: 12.5px; color: #94a3b8; line-height: 1.45; text-wrap: pretty;">
      A whole-day figure, not a plan for the day.
    </p>
  </div>

  <p style="margin: 12px 2px 0; font-size: 12px; color: #64748b; line-height: 1.5; text-wrap: pretty;">
    One question, one answer, in about 150px — with the same week shape as Energy so the
    two screens read as one system.
  </p>
</div>
</x-dc>
</body>
</html>
